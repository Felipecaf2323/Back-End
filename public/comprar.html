<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Comprar Produtos - E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
        .cart-table th, .cart-table td {
            vertical-align: middle;
        }
        .cart-total {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-shopping-cart me-2"></i>E-commerce API
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">
                    <i class="fas fa-home me-1"></i>Início
                </a>
                <a class="nav-link" href="products.html">
                    <i class="fas fa-box me-1"></i>Produtos
                </a>
                <a class="nav-link active" href="comprar.html">
                    <i class="fas fa-credit-card me-1"></i>Comprar
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <!-- Lista de Produtos -->
            <div class="col-md-7 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title mb-4">
                            <i class="fas fa-box-open me-2"></i>Produtos Disponíveis
                        </h3>
                        <div id="productsList">
                            <div class="text-center text-muted">
                                <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
                                <p>Carregando produtos...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Carrinho -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title mb-4">
                            <i class="fas fa-shopping-cart me-2"></i>Carrinho
                        </h3>
                        <div id="cartList"></div>
                        <div class="cart-total mt-3 mb-3" id="cartTotal"></div>
                        <button class="btn btn-primary w-100" id="finalizarCompraBtn">
                            <i class="fas fa-credit-card me-2"></i>Finalizar Compra
                        </button>
                        <div id="orderAlert" class="alert mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/comprar.js"></script>
</body>
</html>
